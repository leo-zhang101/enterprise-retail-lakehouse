# Enterprise Retail Lakehouse Platform — Docker Compose
# Foundation: MinIO (S3-compatible lake) + PostgreSQL (warehouse)
# Run from repository root: docker compose up -d

services:
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: retail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - retail-network

  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      POSTGRES_DB: ${POSTGRES_DB:-retail_warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/scripts/init-postgres-schemas.sh:/docker-entrypoint-initdb.d/01-init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - retail-network

  # Init container: creates MinIO buckets after MinIO is ready
  minio-init:
    image: minio/mc:RELEASE.2024-01-19T05-56-36Z
    container_name: retail-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      for i in 1 2 3 4 5; do
        mc alias set minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && break || sleep 5;
      done;
      mc mb minio/raw --ignore-existing;
      mc mb minio/bronze --ignore-existing;
      mc mb minio/silver --ignore-existing;
      mc mb minio/gold --ignore-existing;
      echo 'MinIO buckets created.';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - retail-network

volumes:
  minio_data:
  postgres_data:

networks:
  retail-network:
    driver: bridge
