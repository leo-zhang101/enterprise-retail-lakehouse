version: 2

models:
  # Staging
  - name: stg_dim_product
    description: Standardized product dimension
    columns:
      - name: product_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_dim_store
    description: Standardized store dimension
    columns:
      - name: store_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_dim_customer
    description: Standardized customer dimension
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - unique
          - not_null

  - name: stg_fact_sales
    description: Valid sales transactions
    columns:
      - name: sale_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_product')
              field: product_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_store')
              field: store_id
      - name: sale_date
        tests:
          - not_null

  - name: stg_fact_inventory_daily
    description: Daily inventory snapshots
    columns:
      - name: snapshot_id
        description: Primary key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_product')
              field: product_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_store')
              field: store_id

  # Intermediate
  - name: int_sales_daily
    description: Daily sales by store
    columns:
      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_store')
              field: store_id
      - name: sale_date
        tests:
          - not_null

  - name: int_product_sales
    description: Product-level sales aggregates
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: int_promotion_sales
    description: Promotion-level sales aggregates
    columns:
      - name: promotion_id
        tests:
          - unique
          - not_null

  # Marts
  - name: mart_store_sales_daily
    description: Store daily sales for reporting
    columns:
      - name: store_id
        tests:
          - not_null
      - name: sale_date
        tests:
          - not_null

  - name: mart_product_performance
    description: Product performance for reporting
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: mart_promotion_effectiveness
    description: Promotion effectiveness for reporting
    columns:
      - name: promotion_id
        tests:
          - unique
          - not_null
